name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT || 22 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FRIDAY
            git pull
            sudo docker image prune -f
            sudo docker builder prune -f
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
            sleep 15
            sudo docker compose exec -T backend alembic upgrade head
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml restart nginx
